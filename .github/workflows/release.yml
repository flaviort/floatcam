name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh --universal

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent FloatCam.app FloatCam.zip
          shasum -a 256 FloatCam.zip | tee FloatCam.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatCam
          path: build/FloatCam.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/FloatCam.zip build/FloatCam.zip.sha256 \
            --title "FloatCam $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
